name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: [highest, lowest]
    name: CI (${{ matrix.dependencies }} deps)
    env:
      # Vendor-originated deprecations from older Symfony releases on the
      # lowest-deps leg must not fail the build — we test that the bundle
      # works across the supported range, not that old Symfony is clean.
      SYMFONY_DEPRECATIONS_HELPER: weak
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.4'
          coverage: ${{ matrix.dependencies == 'highest' && 'xdebug' || 'none' }}
      - name: Install dependencies (highest)
        if: matrix.dependencies == 'highest'
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Install dependencies (lowest)
        if: matrix.dependencies == 'lowest'
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-lowest
      # Static analysis, style, and mutation testing only run on the highest matrix.
      # Dev tooling is not a runtime concern for consumers — running CS-Fixer
      # and PHPStan against old type stubs from the lowest install adds noise
      # without insurance value. The lowest leg still proves the package
      # *installs and the test suite passes* on its declared semver floor.
      - name: PHP-CS-Fixer
        if: matrix.dependencies == 'highest'
        run: composer cs
      - name: PHPStan
        if: matrix.dependencies == 'highest'
        run: composer stan
      - name: PHPUnit
        run: composer test
      # Highest-only because xdebug coverage is gated on the same leg above —
      # running Infection without a coverage driver reports 0% killed (no
      # error) and produces a misleading green build.
      - name: Infection
        if: matrix.dependencies == 'highest'
        run: XDEBUG_MODE=coverage composer infection
